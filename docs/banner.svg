    <path d="M0 80 Q20 64 42 76 T84 72 V94 H0Z" fill="#1d3b2a" opacity=".9"/><path d="M98 82 H182 V94 H98Z" fill="#14284a" opacity=".9"/><path d="M196 178 Q216 162 238 172 T280 168 V196 H196Z" fill="#2b4a3a" opacity=".9"/>
