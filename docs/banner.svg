    <text x="382" y="186" font-size="28" fill="#c9c4b8">One honest photo a day.</text>
    <text x="382" y="222" font-size="20" fill="#8a8f9c" letter-spacing=".5">No feed · no likes · no do-overs</text>
  </g>
