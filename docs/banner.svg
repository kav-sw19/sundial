<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sundial: one honest photo a day">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffd58a"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf7a"/>
      <stop offset="100%" stop-color="#ff8c32"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b2a6e"/><stop offset=".6" stop-color="#ff6f61"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5e9e"/><stop offset="1" stop-color="#9ad0ff"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#3b3f7a"/></linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b05a7a"/><stop offset="1" stop-color="#f6d365"/></linearGradient>
    <linearGradient id="f5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c7a86"/><stop offset="1" stop-color="#c9d6df"/></linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#0f1218"/>
  <!-- the dial -->
  <circle cx="190" cy="160" r="150" fill="url(#glow)"/>
  <circle cx="190" cy="160" r="96" fill="none" stroke="#232938" stroke-width="10"/>
  <path d="M190 64 A96 96 0 1 1 103 200" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="103" cy="200" r="9" fill="#fff"/>
  <circle cx="190" cy="160" r="52" fill="url(#sun)"/>
  <!-- words -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
