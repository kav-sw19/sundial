    <rect x="98" y="6" width="84" height="88" rx="3" fill="url(#f2)"/>
    <rect x="196" y="6" width="84" height="88" rx="3" fill="#000"/>
    <text x="238" y="56" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5a5f6a" text-anchor="middle">missed</text>
